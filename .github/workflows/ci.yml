name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiscore
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aiscore
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
        env:
          DATABASE_URL: postgresql://aiscore:password@localhost:5432/aiscore
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  deploy-api:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Package Lambda zip (prod deps only)
        run: |
          npm ci --omit=dev
          npx prisma generate
          zip -r lambda.zip dist/ node_modules/ prisma/ package.json
      - name: Upload to S3
        run: aws s3 cp lambda.zip s3://aiscore-lambda-deployments/lambda.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name aiscore-api-prod \
            --s3-bucket aiscore-lambda-deployments \
            --s3-key lambda.zip
          aws lambda wait function-updated --function-name aiscore-api-prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Run DB migrations via Lambda
        run: |
          aws lambda invoke \
            --function-name aiscore-api-prod \
            --payload '{"action":"migrate"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/migrate_response.json
          cat /tmp/migrate_response.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

  deploy-frontend:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ADMIN_SECRET: ${{ secrets.VITE_ADMIN_SECRET }}
      - name: Upload to S3
        run: |
          # Hashed build output (/assets/*) never changes under the same name: cache for a year.
          aws s3 sync dist/assets s3://aiscore-frontend-prod/assets --delete \
            --cache-control "public,max-age=31536000,immutable"
          # Files that keep their URL across deploys (robots.txt, llms.txt, sitemap.xml, *.md,
          # .well-known/*, agent skills, favicon, og-image): short cache so changes show up within
          # minutes. "cp --recursive" re-uploads every file, so the header is rewritten even when
          # the content did not change.
          aws s3 cp dist/ s3://aiscore-frontend-prod/ --recursive \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=300, must-revalidate"
          # The API catalog has no file extension; give it its RFC 9727 media type.
          aws s3 cp dist/.well-known/api-catalog s3://aiscore-frontend-prod/.well-known/api-catalog \
            --content-type "application/linkset+json" \
            --cache-control "public, max-age=300, must-revalidate"
          aws s3 cp dist/index.html s3://aiscore-frontend-prod/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          # Remove files that are no longer in the build (uploads nothing: sizes already match).
          aws s3 sync dist/ s3://aiscore-frontend-prod --delete --size-only --exclude "assets/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Purge Cloudflare cache (optional)
        # Runs only when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID secrets exist
        # (token permission: Zone > Cache Purge > Purge). Purges the files that keep their URL
        # across deploys; hashed /assets/* never need it. A failed purge does not fail the deploy.
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare secrets not set, skipping purge."
            exit 0
          fi
          paths=$(cd dist && find . -type f ! -path './assets/*' | sed 's|^\./|/|' | sed 's|^/index\.html$|/|' | sort -u)
          urls=""
          for host in https://www.gradebyai.com https://gradebyai.com; do
            for p in $paths; do urls="$urls$host$p"$'\n'; done
          done
          printf '%s' "$urls" | grep -v '^$' | split -l 30 - /tmp/cf-purge-
          status=0
          for f in /tmp/cf-purge-*; do
            body=$(jq -R -s -c 'split("\n") | map(select(length > 0)) | {files: .}' < "$f")
            res=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data "$body")
            echo "$res" | jq -c '{success, errors}'
            [ "$(echo "$res" | jq -r .success)" = "true" ] || status=1
          done
          exit $status
