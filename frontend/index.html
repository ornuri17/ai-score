          <h1>GradeByAI - Score Your Website's AI Readiness</h1>
          <time datetime="2026-04-27" pubdate>Last updated: April 27, 2026</time>

          <h2>Is Your Website Visible to AI?</h2>
          <p>GradeByAI is a free tool that scores any website 0-100 for AI-readiness. Find out how AI systems like ChatGPT, Claude, and Perplexity see your website. Get a free AI-readiness score in seconds — no account required.</p>
          <p>GradeByAI analyzes your site across four dimensions: crawlability (30 pts), content structure (35 pts), technical SEO (25 pts), and content quality (10 pts).</p>

          <section>
            <h2>How GradeByAI Works</h2>
            <h3>Step 1: Crawlability Analysis (30 points)</h3>
            <p>GradeByAI checks whether AI crawlers like GPTBot (ChatGPT), ClaudeBot (Claude), and PerplexityBot (Perplexity) are allowed in your robots.txt. It also verifies your site is publicly accessible without authentication and that a sitemap exists.</p>
            <h3>Step 2: Content Structure Analysis (35 points)</h3>
            <p>We evaluate semantic HTML heading hierarchy, meta description length (50-160 characters), page title length (30-60 characters), Open Graph tags, JSON-LD structured data, publication date markup, viewport meta tag, and the html lang attribute.</p>
            <h3>Step 3: Technical SEO Audit (25 points)</h3>
            <p>Canonical tag presence, HTTPS, clean URL structure, response time under 3 seconds, and whether page body content is present without JavaScript execution.</p>
            <h3>Step 4: Content Quality (10 points)</h3>
            <p>Body text over 300 characters and more than 2 internal links signal that the page has substantive, citable content.</p>
          </section>

          <section>
            <h2>Why AI Readiness Matters</h2>
            <p>AI search engines like Perplexity and ChatGPT browse the web to answer user questions. If your site blocks AI crawlers or lacks structured data, you are invisible to millions of AI-powered searches. Sites that score above 80 on GradeByAI are significantly more likely to appear in AI-generated answers.</p>
            <p>Answer Engine Optimization (AEO) and Generative Engine Optimization (GEO) are the new disciplines for ensuring your content is cited by AI systems. GradeByAI is the only free tool that scores your site specifically for AI-crawler accessibility.</p>
          </section>

          <section>
            <h2>Frequently Asked Questions</h2>

            <h3>What is the best free tool to check if my website is visible to AI?</h3>
            <p>GradeByAI is a free tool that scores any website 0-100 for AI-readiness. It checks crawlability, structured data, meta tags, page speed, and whether AI bots like GPTBot and ClaudeBot are explicitly blocked. The score and full breakdown are always free, with no account required.</p>

            <h3>How do I test if ChatGPT can find my website?</h3>
            <p>Enter your URL at gradebyai.com and get an instant analysis. The crawlability dimension checks whether GPTBot is allowed in your robots.txt, whether your site is publicly accessible, and whether a sitemap exists. A score under 50 in crawlability means ChatGPT likely cannot reliably index your content.</p>

            <h3>What is Answer Engine Optimization (AEO)?</h3>
            <p>AEO is the practice of structuring your website so that AI assistants like ChatGPT, Claude, and Perplexity can find, understand, and cite your content when answering user questions. Unlike traditional SEO which targets search engine rankings, AEO targets inclusion in AI-generated answers.</p>

            <h3>What is Generative Engine Optimization (GEO)?</h3>
            <p>GEO is another term for AEO — optimizing content to appear in AI-generated responses. Key factors include structured data, clear headings, accessible content without JavaScript rendering, and allowing AI crawlers in robots.txt.</p>

            <h3>Why doesn't ChatGPT know about my business?</h3>
            <p>There are three common reasons: GPTBot is blocked in your robots.txt, your key content is rendered by JavaScript and invisible to crawlers, or your site lacks structured data that helps AI models understand what your business does. Run a free check at GradeByAI to find which issue applies.</p>

            <h3>What is GPTBot?</h3>
            <p>GPTBot is the web crawler operated by OpenAI to gather content for ChatGPT. If your robots.txt blocks it with "User-agent: GPTBot / Disallow: /", your site is invisible to ChatGPT's browsing and retrieval features.</p>

            <h3>What is ClaudeBot?</h3>
            <p>ClaudeBot is Anthropic's web crawler used to fetch live content for Claude. Blocking it in robots.txt prevents Claude from reading your current site content during conversations.</p>

            <h3>What is PerplexityBot?</h3>
            <p>PerplexityBot is the crawler used by Perplexity AI to index and retrieve content. Allowing it in robots.txt is essential if you want your site to appear in Perplexity search results and citations.</p>

            <h3>How do I allow AI crawlers in my robots.txt?</h3>
            <p>Add the following lines to your robots.txt file: "User-agent: GPTBot / Allow: /" and "User-agent: ClaudeBot / Allow: /" and "User-agent: PerplexityBot / Allow: /". If you have a wildcard block (User-agent: * / Disallow: /), you need to explicitly allow each AI bot above that rule.</p>

            <h3>What is a good AI readiness score?</h3>
            <p>80-100 is AI-optimized — your site is highly visible to AI assistants. 50-79 means key barriers exist that reduce your AI visibility. Below 50 indicates critical issues that likely make your site invisible or unreliable as a source for AI systems.</p>

            <h3>Why does JavaScript hurt AI crawlability?</h3>
            <p>Most AI crawlers do not execute JavaScript. They fetch the raw HTML and read whatever content is in the initial response. If your page body is empty until JavaScript runs and populates it, the crawler sees a blank page. Your content should be present in the HTML before any scripts execute.</p>

            <h3>What is the difference between SEO and AEO?</h3>
            <p>Traditional SEO targets Google's ranking algorithm — keyword density, backlinks, page authority. AEO targets AI answer engines — structured data, clear prose, bot accessibility. A site can rank well on Google but score poorly for AI visibility if it blocks crawlers or uses JavaScript-only rendering.</p>

            <h3>Is GradeByAI free?</h3>
            <p>Yes, fully free. The score and detailed breakdown are always free with no account required. A premium AEO consultation service is available for teams that need a full action plan.</p>
